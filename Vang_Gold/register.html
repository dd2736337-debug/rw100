<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Đăng ký - Gold Store</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, Helvetica, sans-serif;
                min-height: 100vh;
                background: #f5f5f5;

                display: flex;
                flex-direction: column;
            }

            a {
                text-decoration: none;
            }

            /* ================= HEADER ================= */

            header {
                height: 70px;
                background: #111;
                color: white;
            }

            .header-container {
                width: 90%;
                max-width: 1200px;
                height: 100%;
                margin: auto;

                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .logo {
                font-size: 25px;
                font-weight: bold;
                color: #d4af37;
            }

            .logo span {
                color: white;
            }

            .home-link {
                color: white;
                font-size: 15px;
            }

            .home-link:hover {
                color: #d4af37;
            }

            /* ================= MAIN ================= */

            main {
                flex: 1;

                display: flex;
                align-items: center;
                justify-content: center;

                padding: 50px 20px;
            }

            .register-container {
                width: 100%;
                max-width: 500px;
            }

            .register-card {
                background: white;

                padding: 40px;

                border-radius: 10px;

                box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            }

            /* ================= TITLE ================= */

            .register-title {
                text-align: center;

                margin-bottom: 30px;
            }

            .register-title h1 {
                font-size: 30px;

                margin-bottom: 10px;

                color: #222;
            }

            .register-title p {
                color: #777;

                font-size: 14px;
            }

            /* ================= MESSAGE ================= */

            .message {
                display: none;

                padding: 12px;

                margin-bottom: 20px;

                border-radius: 5px;

                font-size: 14px;

                text-align: center;
            }

            .message.error {
                display: block;

                background: #ffe5e5;

                color: #c62828;
            }

            .message.success {
                display: block;

                background: #e5f7e5;

                color: #2e7d32;
            }

            /* ================= FORM ================= */

            .form-group {
                margin-bottom: 18px;
            }

            .form-group label {
                display: block;

                margin-bottom: 8px;

                font-size: 14px;

                font-weight: bold;

                color: #333;
            }

            .form-group input {
                width: 100%;

                height: 45px;

                padding: 0 14px;

                border: 1px solid #ddd;

                border-radius: 5px;

                font-size: 15px;

                outline: none;

                transition: 0.2s;
            }

            .form-group input:focus {
                border-color: #d4af37;
            }

            /* ================= PASSWORD ================= */

            .password-wrapper {
                position: relative;
            }

            .password-wrapper input {
                padding-right: 65px;
            }

            .show-password {
                position: absolute;

                right: 12px;
                top: 50%;

                transform: translateY(-50%);

                border: none;

                background: none;

                cursor: pointer;

                color: #777;

                font-size: 13px;
            }

            .show-password:hover {
                color: #d4af37;
            }

            /* ================= PASSWORD NOTE ================= */

            .password-note {
                margin-top: 6px;

                font-size: 12px;

                color: #888;
            }

            /* ================= TERMS ================= */

            .terms {
                display: flex;

                align-items: flex-start;

                gap: 8px;

                margin: 20px 0;

                font-size: 13px;

                color: #666;

                line-height: 1.5;
            }

            .terms input {
                margin-top: 3px;

                cursor: pointer;
            }

            .terms a {
                color: #b08d20;
            }

            .terms a:hover {
                text-decoration: underline;
            }

            /* ================= BUTTON ================= */

            .register-button {
                width: 100%;

                height: 48px;

                border: none;

                border-radius: 5px;

                background: #d4af37;

                color: #111;

                font-size: 16px;

                font-weight: bold;

                cursor: pointer;

                transition: 0.2s;
            }

            .register-button:hover {
                background: #bd9828;
            }

            /* ================= LOGIN ================= */

            .login-link {
                margin-top: 25px;

                text-align: center;

                color: #777;

                font-size: 14px;
            }

            .login-link a {
                color: #b08d20;

                font-weight: bold;
            }

            .login-link a:hover {
                text-decoration: underline;
            }

            /* ================= FOOTER ================= */

            footer {
                background: #111;

                color: #888;

                text-align: center;

                padding: 18px;

                font-size: 13px;
            }

            /* ================= RESPONSIVE ================= */

            @media (max-width: 600px) {
                header {
                    height: 60px;
                }

                .header-container {
                    width: 92%;
                }

                .logo {
                    font-size: 21px;
                }

                .home-link {
                    font-size: 13px;
                }

                main {
                    padding: 30px 15px;
                }

                .register-card {
                    padding: 30px 22px;
                }

                .register-title h1 {
                    font-size: 26px;
                }
            }
        </style>
    </head>

    <body>
        <!-- ================= HEADER ================= -->

        <header>
            <div class="header-container">
                <a href="index.html" class="logo"> GOLD<span>STORE</span> </a>

                <a href="index.html" class="home-link"> ← Về trang chủ </a>
            </div>
        </header>

        <!-- ================= MAIN ================= -->

        <main>
            <div class="register-container">
                <div class="register-card">
                    <!-- TITLE -->

                    <div class="register-title">
                        <h1>Tạo tài khoản</h1>

                        <p>Đăng ký tài khoản Gold Store</p>
                    </div>

                    <!-- MESSAGE -->

                    <div id="message" class="message"></div>

                    <!-- FORM -->

                    <form id="registerForm">
                        <!-- FULL NAME -->

                        <div class="form-group">
                            <label for="fullName"> Họ và tên </label>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Nhập họ và tên"
                                autocomplete="name"
                                required
                            />
                        </div>

                        <!-- EMAIL -->

                        <div class="form-group">
                            <label for="email"> Email </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Nhập email"
                                autocomplete="email"
                                required
                            />
                        </div>

                        <!-- PHONE -->

                        <div class="form-group">
                            <label for="phone"> Số điện thoại </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Nhập số điện thoại"
                                autocomplete="tel"
                                required
                            />
                        </div>

                        <!-- PASSWORD -->

                        <div class="form-group">
                            <label for="password"> Mật khẩu </label>

                            <div class="password-wrapper">
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Nhập mật khẩu"
                                    autocomplete="new-password"
                                    required
                                />

                                <button
                                    type="button"
                                    class="show-password"
                                    onclick="togglePassword('password', this)"
                                >
                                    Hiện
                                </button>
                            </div>

                            <p class="password-note">
                                Mật khẩu nên có ít nhất 6 ký tự.
                            </p>
                        </div>

                        <!-- CONFIRM PASSWORD -->

                        <div class="form-group">
                            <label for="confirmPassword">
                                Xác nhận mật khẩu
                            </label>

                            <div class="password-wrapper">
                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Nhập lại mật khẩu"
                                    autocomplete="new-password"
                                    required
                                />

                                <button
                                    type="button"
                                    class="show-password"
                                    onclick="
                                        togglePassword('confirmPassword', this)
                                    "
                                >
                                    Hiện
                                </button>
                            </div>
                        </div>

                        <!-- TERMS -->

                        <label class="terms">
                            <input type="checkbox" id="terms" required />

                            <span>
                                Tôi đồng ý với
                                <a href="#"> điều khoản sử dụng </a>
                                và
                                <a href="#"> chính sách bảo mật </a>
                                của Gold Store.
                            </span>
                        </label>

                        <!-- REGISTER BUTTON -->

                        <button type="submit" class="register-button">
                            Đăng ký
                        </button>
                    </form>

                    <!-- LOGIN LINK -->

                    <div class="login-link">
                        Đã có tài khoản?

                        <a href="login.html"> Đăng nhập </a>
                    </div>
                </div>
            </div>
        </main>

        <!-- ================= FOOTER ================= -->

        <footer>© 2026 GOLD STORE. All rights reserved.</footer>

        <!-- ================= JAVASCRIPT ================= -->

        <script>
            /*
             * Hiện / ẩn mật khẩu
             */

            function togglePassword(inputId, button) {
                const input = document.getElementById(inputId);

                if (input.type === "password") {
                    input.type = "text";

                    button.textContent = "Ẩn";
                } else {
                    input.type = "password";

                    button.textContent = "Hiện";
                }
            }

            /*
             * Hiện thông báo
             */

            function showMessage(message, type) {
                const element = document.getElementById("message");

                element.textContent = message;

                element.className = "message " + type;
            }

            /*
             * Validate đăng ký cơ bản
             *
             * Chưa gọi Backend.
             */

            document
                .getElementById("registerForm")
                .addEventListener("submit", function (event) {
                    event.preventDefault();

                    const fullName = document
                        .getElementById("fullName")
                        .value.trim();

                    const email = document.getElementById("email").value.trim();

                    const phone = document.getElementById("phone").value.trim();

                    const password = document.getElementById("password").value;

                    const confirmPassword =
                        document.getElementById("confirmPassword").value;

                    const terms = document.getElementById("terms").checked;

                    if (fullName.length < 2) {
                        showMessage("Vui lòng nhập họ và tên hợp lệ.", "error");

                        return;
                    }

                    if (!email) {
                        showMessage("Vui lòng nhập email.", "error");

                        return;
                    }

                    if (!phone) {
                        showMessage("Vui lòng nhập số điện thoại.", "error");

                        return;
                    }

                    if (password.length < 6) {
                        showMessage(
                            "Mật khẩu phải có ít nhất 6 ký tự.",
                            "error",
                        );

                        return;
                    }

                    if (password !== confirmPassword) {
                        showMessage("Mật khẩu xác nhận không khớp.", "error");

                        return;
                    }

                    if (!terms) {
                        showMessage(
                            "Bạn cần đồng ý với điều khoản sử dụng.",
                            "error",
                        );

                        return;
                    }

                    /*
                     * Chưa gửi dữ liệu lên Backend.
                     *
                     * Khi có API đăng ký thực tế,
                     * phần này sẽ được thay bằng
                     * fetch() / api.js.
                     */

                    showMessage(
                        "Thông tin hợp lệ. Chức năng đăng ký sẽ được kết nối với Backend.",
                        "success",
                    );
                });
        </script>
    </body>
</html>
