<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Quên mật khẩu - Gold Store</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, Helvetica, sans-serif;

                min-height: 100vh;

                background: #f5f5f5;

                display: flex;
                flex-direction: column;
            }

            a {
                text-decoration: none;
            }

            /* ================= HEADER ================= */

            header {
                height: 70px;

                background: #111;

                color: white;
            }

            .header-container {
                width: 90%;
                max-width: 1200px;

                height: 100%;

                margin: auto;

                display: flex;

                align-items: center;

                justify-content: space-between;
            }

            .logo {
                font-size: 25px;

                font-weight: bold;

                color: #d4af37;
            }

            .logo span {
                color: white;
            }

            .home-link {
                color: white;

                font-size: 15px;
            }

            .home-link:hover {
                color: #d4af37;
            }

            /* ================= MAIN ================= */

            main {
                flex: 1;

                display: flex;

                align-items: center;

                justify-content: center;

                padding: 50px 20px;
            }

            .forgot-container {
                width: 100%;

                max-width: 450px;
            }

            .forgot-card {
                background: white;

                padding: 40px;

                border-radius: 10px;

                box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            }

            /* ================= ICON ================= */

            .forgot-icon {
                width: 70px;

                height: 70px;

                margin: 0 auto 20px;

                border-radius: 50%;

                background: #f8f0d5;

                display: flex;

                align-items: center;

                justify-content: center;

                font-size: 32px;
            }

            /* ================= TITLE ================= */

            .forgot-title {
                text-align: center;

                margin-bottom: 30px;
            }

            .forgot-title h1 {
                font-size: 29px;

                color: #222;

                margin-bottom: 10px;
            }

            .forgot-title p {
                color: #777;

                font-size: 14px;

                line-height: 1.6;
            }

            /* ================= MESSAGE ================= */

            .message {
                display: none;

                padding: 12px;

                margin-bottom: 20px;

                border-radius: 5px;

                font-size: 14px;

                text-align: center;

                line-height: 1.5;
            }

            .message.error {
                display: block;

                background: #ffe5e5;

                color: #c62828;
            }

            .message.success {
                display: block;

                background: #e5f7e5;

                color: #2e7d32;
            }

            /* ================= FORM ================= */

            .form-group {
                margin-bottom: 20px;
            }

            .form-group label {
                display: block;

                margin-bottom: 8px;

                font-size: 14px;

                font-weight: bold;

                color: #333;
            }

            .form-group input {
                width: 100%;

                height: 46px;

                padding: 0 14px;

                border: 1px solid #ddd;

                border-radius: 5px;

                font-size: 15px;

                outline: none;

                transition: 0.2s;
            }

            .form-group input:focus {
                border-color: #d4af37;
            }

            /* ================= BUTTON ================= */

            .submit-button {
                width: 100%;

                height: 48px;

                border: none;

                border-radius: 5px;

                background: #d4af37;

                color: #111;

                font-size: 16px;

                font-weight: bold;

                cursor: pointer;

                transition: 0.2s;
            }

            .submit-button:hover {
                background: #bd9828;
            }

            /* ================= BACK LOGIN ================= */

            .back-login {
                margin-top: 25px;

                text-align: center;

                font-size: 14px;

                color: #777;
            }

            .back-login a {
                color: #b08d20;

                font-weight: bold;
            }

            .back-login a:hover {
                text-decoration: underline;
            }

            /* ================= REGISTER ================= */

            .register-link {
                margin-top: 15px;

                text-align: center;

                font-size: 13px;

                color: #888;
            }

            .register-link a {
                color: #b08d20;
            }

            /* ================= FOOTER ================= */

            footer {
                background: #111;

                color: #888;

                text-align: center;

                padding: 18px;

                font-size: 13px;
            }

            /* ================= RESPONSIVE ================= */

            @media (max-width: 600px) {
                header {
                    height: 60px;
                }

                .header-container {
                    width: 92%;
                }

                .logo {
                    font-size: 21px;
                }

                .home-link {
                    font-size: 13px;
                }

                main {
                    padding: 30px 15px;
                }

                .forgot-card {
                    padding: 30px 22px;
                }

                .forgot-title h1 {
                    font-size: 25px;
                }
            }
        </style>
    </head>

    <body>
        <!-- ================= HEADER ================= -->

        <header>
            <div class="header-container">
                <a href="index.html" class="logo"> GOLD<span>STORE</span> </a>

                <a href="index.html" class="home-link"> ← Về trang chủ </a>
            </div>
        </header>

        <!-- ================= MAIN ================= -->

        <main>
            <div class="forgot-container">
                <div class="forgot-card">
                    <!-- ICON -->

                    <div class="forgot-icon">🔐</div>

                    <!-- TITLE -->

                    <div class="forgot-title">
                        <h1>Quên mật khẩu?</h1>

                        <p>
                            Nhập email đã đăng ký. Chúng tôi sẽ hỗ trợ bạn khôi
                            phục mật khẩu.
                        </p>
                    </div>

                    <!-- MESSAGE -->

                    <div id="message" class="message"></div>

                    <!-- FORM -->

                    <form id="forgotPasswordForm">
                        <div class="form-group">
                            <label for="email"> Email </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Nhập email của bạn"
                                autocomplete="email"
                                required
                            />
                        </div>

                        <button type="submit" class="submit-button">
                            Gửi yêu cầu
                        </button>
                    </form>

                    <!-- BACK LOGIN -->

                    <div class="back-login">
                        Nhớ mật khẩu?

                        <a href="login.html"> Đăng nhập </a>
                    </div>

                    <!-- REGISTER -->

                    <div class="register-link">
                        Chưa có tài khoản?

                        <a href="register.html"> Đăng ký </a>
                    </div>
                </div>
            </div>
        </main>

        <!-- ================= FOOTER ================= -->

        <footer>© 2026 GOLD STORE. All rights reserved.</footer>

        <!-- ================= JAVASCRIPT ================= -->

        <script>
            /*
             * Hiện thông báo
             */

            function showMessage(message, type) {
                const element = document.getElementById("message");

                element.textContent = message;

                element.className = "message " + type;
            }

            /*
             * Submit form
             *
             * Chưa kết nối Backend.
             */

            document
                .getElementById("forgotPasswordForm")
                .addEventListener("submit", function (event) {
                    event.preventDefault();

                    const email = document.getElementById("email").value.trim();

                    if (!email) {
                        showMessage("Vui lòng nhập email.", "error");

                        return;
                    }

                    showMessage(
                        "Yêu cầu hợp lệ. Chức năng khôi phục mật khẩu sẽ được kết nối với Backend.",
                        "success",
                    );
                });
        </script>
    </body>
</html>
