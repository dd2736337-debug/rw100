
<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin Dashboard</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
    </head>

    <body>
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-md-2 bg-dark text-white vh-100">
                    <h3 class="mt-3 text-center">GOLD ADMIN</h3>

                    <hr />

                    <ul class="nav flex-column">
                        <li class="nav-item mb-2">
                            <a
                                href="dashboard.html"
                                class="nav-link text-white"
                            >
                                <i class="fa fa-home"></i>
                                Dashboard
                            </a>
                        </li>

                        <li class="nav-item mb-2">
                            <a href="golds.html" class="nav-link text-white">
                                <i class="fa fa-coins"></i>
                                Quản lý Gold
                            </a>
                        </li>

                        <li class="nav-item mb-2">
                            <a
                                href="categories.html"
                                class="nav-link text-white"
                            >
                                <i class="fa fa-list"></i>
                                Category
                            </a>
                        </li>

                        <li class="nav-item mb-2">
                            <a href="users.html" class="nav-link text-white">
                                <i class="fa fa-user"></i>
                                User
                            </a>
                        </li>

                        <li class="nav-item mb-2">
                            <a href="orders.html" class="nav-link text-white">
                                <i class="fa fa-cart-shopping"></i>
                                Order
                            </a>
                        </li>

                        <li class="nav-item mt-5">
                            <button
                                class="btn btn-danger w-100"
                                onclick="logout()"
                            >
                                Đăng xuất
                            </button>
                        </li>
                    </ul>
                </div>

                <!-- Content -->
                <div class="col-md-10">
                    <h2 class="mt-3">Dashboard</h2>

                    <div class="row mt-4">
                        <div class="col-md-3">
                            <div class="card shadow">
                                <div class="card-body text-center">
                                    <h5>Tổng User</h5>
                                    <h2 id="totalUsers">0</h2>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="card shadow">
                                <div class="card-body text-center">
                                    <h5>Tổng Gold</h5>
                                    <h2 id="totalGolds">0</h2>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="card shadow">
                                <div class="card-body text-center">
                                    <h5>Tổng Order</h5>
                                    <h2 id="totalOrders">0</h2>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="card shadow">
                                <div class="card-body text-center">
                                    <h5>Doanh thu</h5>
                                    <h2 id="revenue">0 VNĐ</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <script>
            function logout() {
                localStorage.clear();
                window.location.href = "../login.html";
            }

            loadDashboard();

            function loadDashboard() {
                $("#totalUsers").text(25);
                $("#totalGolds").text(150);
                $("#totalOrders").text(60);
                $("#revenue").text("500.000.000");
            }
        </script>
    </body>
</html>
