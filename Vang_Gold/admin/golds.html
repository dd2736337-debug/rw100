<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Quản lý Gold</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
    </head>
    <body>
        <div class="container mt-4">
            <div class="d-flex justify-content-between mb-3">
                <h2>Quản lý Gold</h2>

                <button
                    class="btn btn-success"
                    data-bs-toggle="modal"
                    data-bs-target="#goldModal"
                >
                    Thêm Gold
                </button>
            </div>

            <!-- Search -->
            <div class="row mb-3">
                <div class="col-md-3">
                    <input
                        type="text"
                        id="searchName"
                        class="form-control"
                        placeholder="Tên vàng"
                    />
                </div>

                <div class="col-md-3">
                    <input
                        type="text"
                        id="searchType"
                        class="form-control"
                        placeholder="Loại vàng"
                    />
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary" onclick="loadGolds()">
                        Tìm kiếm
                    </button>
                </div>
            </div>

            <!-- Table -->
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên</th>
                        <th>Loại</th>
                        <th>Khối lượng</th>
                        <th>Giá</th>
                        <th>Số lượng</th>
                        <th>Danh mục</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="goldTable"></tbody>
            </table>

            <!-- Pagination -->
            <nav>
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>

        <!-- Modal -->
        <div class="modal fade" id="goldModal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5>Gold</h5>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" id="goldId" />

                        <div class="mb-2">
                            <label>Tên</label>
                            <input type="text" id="name" class="form-control" />
                        </div>

                        <div class="mb-2">
                            <label>Loại</label>
                            <input type="text" id="type" class="form-control" />
                        </div>

                        <div class="mb-2">
                            <label>Khối lượng</label>
                            <input
                                type="number"
                                id="weight"
                                class="form-control"
                            />
                        </div>

                        <div class="mb-2">
                            <label>Giá</label>
                            <input
                                type="number"
                                id="price"
                                class="form-control"
                            />
                        </div>

                        <div class="mb-2">
                            <label>Số lượng</label>
                            <input
                                type="number"
                                id="quantity"
                                class="form-control"
                            />
                        </div>

                        <div class="mb-2">
                            <label>Category ID</label>
                            <input
                                type="number"
                                id="categoryId"
                                class="form-control"
                            />
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-primary" onclick="saveGold()">
                            Lưu
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

        <script src="./js/golds.js"></script>
    </body>
</html>
