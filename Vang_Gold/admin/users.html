<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý người dùng - Gold Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            width: 94%;
            max-width: 1400px;
            margin: 30px auto;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: white;
            border-radius: 12px;
            padding: 22px 25px;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 7px 0 0;
            color: #777;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* =========================
           BUTTON
        ========================= */

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #b8860b;
            color: white;
        }

        .btn-primary:hover {
            background: #9c7209;
        }

        .btn-secondary {
            background: #eee;
            color: #333;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-warning {
            background: #f0ad4e;
            color: white;
        }

        .btn-success {
            background: #198754;
            color: white;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .message.error {
            display: block;
            background: #ffebee;
            color: #c62828;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;

            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;

            border: 1px solid #ddd;
            border-radius: 7px;

            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #b8860b;
        }

        /* =========================
           TABLE
        ========================= */

        .table-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #fafafa;
            font-size: 14px;
        }

        tr:hover td {
            background: #fffdf5;
        }

        .role {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .role-admin {
            background: #f8d7da;
            color: #842029;
        }

        .role-customer {
            background: #d1e7dd;
            color: #0f5132;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 7px 10px;
            font-size: 12px;
        }

        /* =========================
           PAGINATION
        ========================= */

        .pagination {
            padding: 20px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .page-info {
            font-weight: bold;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.5);

            align-items: center;
            justify-content: center;

            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 94%;
            max-width: 550px;

            border-radius: 12px;
            padding: 25px;

            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            font-size: 26px;
            cursor: pointer;
            color: #777;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #777;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 900px) {
            .search-grid {
                grid-template-columns: 1fr 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }

        @media (max-width: 600px) {
            .search-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 96%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <div>
            <h1>Quản lý người dùng</h1>
            <p>
                Quản lý tài khoản CUSTOMER và ADMIN
            </p>
        </div>

        <div class="header-actions">

            <button
                class="btn-primary"
                onclick="openCreateModal()">
                + Thêm người dùng
            </button>

            <button
                class="btn-secondary"
                onclick="goBack()">
                ← Quay lại
            </button>

            <button
                class="btn-danger"
                onclick="logout()">
                Đăng xuất
            </button>

        </div>

    </div>


    <!-- =========================
         MESSAGE
    ========================== -->

    <div id="message" class="message"></div>


    <!-- =========================
         SEARCH
    ========================== -->

    <div class="search-card">

        <div class="search-grid">

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    id="searchUsername"
                    placeholder="Nhập username">

            </div>

            <div class="input-group">

                <label>Email</label>

                <input
                    type="text"
                    id="searchEmail"
                    placeholder="Nhập email">

            </div>

            <div class="input-group">

                <label>Họ và tên</label>

                <input
                    type="text"
                    id="searchFullName"
                    placeholder="Nhập họ tên">

            </div>

            <div class="input-group">

                <label>&nbsp;</label>

                <button
                    class="btn-primary"
                    onclick="searchUsers()">

                    Tìm kiếm

                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         TABLE
    ========================== -->

    <div class="table-card">

        <div class="table-wrapper">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Username</th>

                    <th>Họ tên</th>

                    <th>Email</th>

                    <th>Số điện thoại</th>

                    <th>Địa chỉ</th>

                    <th>Role</th>

                    <th>Thao tác</th>

                </tr>

                </thead>

                <tbody id="userTableBody">

                </tbody>

            </table>

        </div>


        <div id="loading" class="loading">
            Đang tải danh sách người dùng...
        </div>


        <div id="empty" class="empty" style="display:none;">
            Không tìm thấy người dùng.
        </div>


        <!-- =========================
             PAGINATION
        ========================== -->

        <div class="pagination">

            <button
                class="btn-secondary"
                id="previousButton"
                onclick="previousPage()">

                ← Trước

            </button>

            <span
                class="page-info"
                id="pageInfo">

                Trang 1

            </span>

            <button
                class="btn-secondary"
                id="nextButton"
                onclick="nextPage()">

                Sau →

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     CREATE / EDIT MODAL
========================================================= -->

<div id="userModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Thêm người dùng
            </h2>

            <span
                class="close"
                onclick="closeModal()">

                &times;

            </span>

        </div>


        <form id="userForm">

            <input
                type="hidden"
                id="editUserId">


            <!-- USERNAME -->

            <div
                class="form-group"
                id="usernameGroup">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    required>

            </div>


            <!-- PASSWORD -->

            <div
                class="form-group"
                id="passwordGroup">

                <label>Mật khẩu</label>

                <input
                    type="password"
                    id="password">

            </div>


            <!-- FULL NAME -->

            <div class="form-group">

                <label>Họ và tên</label>

                <input
                    type="text"
                    id="fullName"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    required>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>Số điện thoại</label>

                <input
                    type="text"
                    id="phone"
                    maxlength="10"
                    placeholder="0123456789"
                    required>

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label>Địa chỉ</label>

                <input
                    type="text"
                    id="address"
                    required>

            </div>


            <!-- ROLE -->

            <div class="form-group">

                <label>Vai trò</label>

                <select id="role">

                    <option value="CUSTOMER">
                        CUSTOMER
                    </option>

                    <option value="ADMIN">
                        ADMIN
                    </option>

                </select>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn-secondary"
                    onclick="closeModal()">

                    Hủy

                </button>

                <button
                    type="submit"
                    class="btn-primary"
                    id="saveButton">

                    Lưu

                </button>

            </div>

        </form>

    </div>

</div>


<script>

    // =========================================================
    // CONFIG
    // =========================================================

    const API_BASE_URL = "http://localhost:8080/api";


    let currentPage = 0;

    const pageSize = 5;

    let totalPages = 0;


    // =========================================================
    // DOM
    // =========================================================

    const messageElement =
        document.getElementById("message");

    const tableBody =
        document.getElementById("userTableBody");

    const loadingElement =
        document.getElementById("loading");

    const emptyElement =
        document.getElementById("empty");


    // =========================================================
    // TOKEN
    // =========================================================

    function getToken() {

        return (
            localStorage.getItem("token") ||
            localStorage.getItem("accessToken")
        );

    }


    // =========================================================
    // ROLE
    // =========================================================

    function getRole() {

        return localStorage.getItem("role");

    }


    // =========================================================
    // CHECK ADMIN
    // =========================================================

    function checkAdmin() {

        const token = getToken();

        const role = getRole();

        if (!token) {

            alert(
                "Bạn chưa đăng nhập."
            );

            window.location.href =
                "../login.html";

            return false;

        }


        if (role !== "ADMIN") {

            alert(
                "Bạn không có quyền truy cập trang quản lý."
            );

            window.location.href =
                "../customer/products.html";

            return false;

        }


        return true;

    }


    // =========================================================
    // MESSAGE
    // =========================================================

    function showMessage(
        message,
        type = "error"
    ) {

        messageElement.textContent =
            message;

        messageElement.className =
            "message " + type;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function hideMessage() {

        messageElement.textContent = "";

        messageElement.className =
            "message";

    }


    // =========================================================
    // FETCH JSON / TEXT
    // =========================================================

    async function readResponse(response) {

        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if (
            contentType.includes(
                "application/json"
            )
        ) {

            return await response.json();

        }


        const text =
            await response.text();

        return {
            message: text
        };

    }


    // =========================================================
    // LOAD USERS
    // =========================================================

    async function loadUsers() {

        hideMessage();

        loadingElement.style.display =
            "block";

        emptyElement.style.display =
            "none";

        tableBody.innerHTML = "";


        const token = getToken();


        if (!token) {

            window.location.href =
                "../login.html";

            return;

        }


        try {

            const username =
                document
                    .getElementById(
                        "searchUsername"
                    )
                    .value
                    .trim();

            const email =
                document
                    .getElementById(
                        "searchEmail"
                    )
                    .value
                    .trim();

            const fullName =
                document
                    .getElementById(
                        "searchFullName"
                    )
                    .value
                    .trim();


            const params =
                new URLSearchParams();

            params.set(
                "page",
                currentPage
            );

            params.set(
                "size",
                pageSize
            );

            params.set(
                "sort",
                "id,desc"
            );


            if (username) {

                params.set(
                    "username",
                    username
                );

            }


            if (email) {

                params.set(
                    "email",
                    email
                );

            }


            if (fullName) {

                params.set(
                    "fullName",
                    fullName
                );

            }


            const response =
                await fetch(
                    `${API_BASE_URL}/users?${params.toString()}`,
                    {
                        method: "GET",

                        headers: {
                            Authorization:
                                `Bearer ${token}`,

                            Accept:
                                "application/json"
                        }
                    }
                );


            const data =
                await readResponse(
                    response
                );


            console.log(
                "Users response:",
                data
            );


            if (!response.ok) {

                if (
                    response.status === 401
                ) {

                    logout();

                    return;

                }


                if (
                    response.status === 403
                ) {

                    throw new Error(
                        "Bạn không có quyền quản lý người dùng."
                    );

                }


                throw new Error(
                    data?.message ||
                    data?.error ||
                    "Không thể tải danh sách người dùng."
                );

            }


            renderUsers(
                data.content || []
            );


            totalPages =
                data.totalPages || 0;


            updatePagination(
                data
            );


        } catch (error) {

            console.error(
                "Load users error:",
                error
            );

            showMessage(
                error.message ||
                "Có lỗi khi tải danh sách người dùng."
            );

        } finally {

            loadingElement.style.display =
                "none";

        }

    }


    // =========================================================
    // RENDER USERS
    // =========================================================

    function renderUsers(users) {

        tableBody.innerHTML = "";


        if (!users.length) {

            emptyElement.style.display =
                "block";

            return;

        }


        emptyElement.style.display =
            "none";


        users.forEach(user => {

            const tr =
                document.createElement(
                    "tr"
                );


            const roleClass =
                user.role === "ADMIN"
                    ? "role-admin"
                    : "role-customer";


            const roleText =
                user.role || "CUSTOMER";


            tr.innerHTML = `

                <td>
                    ${escapeHtml(user.id)}
                </td>

                <td>
                    <strong>
                        ${escapeHtml(user.username)}
                    </strong>
                </td>

                <td>
                    ${escapeHtml(user.fullName)}
                </td>

                <td>
                    ${escapeHtml(user.email)}
                </td>

                <td>
                    ${escapeHtml(user.phone)}
                </td>

                <td>
                    ${escapeHtml(user.address)}
                </td>

                <td>
                    <span class="role ${roleClass}">
                        ${escapeHtml(roleText)}
                    </span>
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="btn-warning"
                            onclick="editUser(${user.id})">

                            Sửa

                        </button>

                        <button
                            class="btn-success"
                            onclick="changeRole(
                                ${user.id},
                                '${user.role}'
                            )">

                            Đổi role

                        </button>

                        <button
                            class="btn-danger"
                            onclick="deleteUser(
                                ${user.id},
                                '${escapeJs(user.username)}'
                            )">

                            Xóa

                        </button>

                    </div>

                </td>

            `;


            tableBody.appendChild(tr);

        });

    }


    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function escapeJs(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replaceAll("\\", "\\\\")
            .replaceAll("'", "\\'")
            .replaceAll('"', '\\"');

    }


    // =========================================================
    // PAGINATION
    // =========================================================

    function updatePagination(data) {

        const page =
            data.number ?? 0;

        const pages =
            data.totalPages ?? 0;


        document.getElementById(
            "pageInfo"
        ).textContent =
            pages > 0
                ? `Trang ${page + 1} / ${pages}`
                : "Trang 0";


        document.getElementById(
            "previousButton"
        ).disabled =
            page <= 0;


        document.getElementById(
            "nextButton"
        ).disabled =
            page >= pages - 1;

    }


    function previousPage() {

        if (currentPage <= 0) {
            return;
        }

        currentPage--;

        loadUsers();

    }


    function nextPage() {

        if (
            currentPage >=
            totalPages - 1
        ) {

            return;

        }

        currentPage++;

        loadUsers();

    }


    // =========================================================
    // SEARCH
    // =========================================================

    function searchUsers() {

        currentPage = 0;

        loadUsers();

    }


    // =========================================================
    // ENTER SEARCH
    // =========================================================

    [
        "searchUsername",
        "searchEmail",
        "searchFullName"
    ].forEach(id => {

        document
            .getElementById(id)
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        searchUsers();

                    }

                }
            );

    });


    // =========================================================
    // OPEN CREATE
    // =========================================================

    function openCreateModal() {

        document.getElementById(
            "modalTitle"
        ).textContent =
            "Thêm người dùng";


        document.getElementById(
            "editUserId"
        ).value = "";


        document.getElementById(
            "userForm"
        ).reset();


        document.getElementById(
            "usernameGroup"
        ).style.display =
            "block";


        document.getElementById(
            "passwordGroup"
        ).style.display =
            "block";


        document.getElementById(
            "username"
        ).disabled =
            false;


        document.getElementById(
            "password"
        ).required =
            true;


        document.getElementById(
            "role"
        ).value =
            "CUSTOMER";


        document.getElementById(
            "userModal"
        ).classList.add(
            "show"
        );

    }


    // =========================================================
    // CLOSE MODAL
    // =========================================================

    function closeModal() {

        document.getElementById(
            "userModal"
        ).classList.remove(
            "show"
        );

    }


    // =========================================================
    // EDIT USER
    // =========================================================

    async function editUser(id) {

        hideMessage();


        const token = getToken();


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/users/${id}`,
                    {
                        method: "GET",

                        headers: {
                            Authorization:
                                `Bearer ${token}`,

                            Accept:
                                "application/json"
                        }
                    }
                );


            const data =
                await readResponse(
                    response
                );


            if (!response.ok) {

                throw new Error(
                    data?.message ||
                    "Không thể tải thông tin user."
                );

            }


            document.getElementById(
                "modalTitle"
            ).textContent =
                "Sửa người dùng";


            document.getElementById(
                "editUserId"
            ).value =
                data.id;


            document.getElementById(
                "username"
            ).value =
                data.username || "";


            document.getElementById(
                "username"
            ).disabled =
                true;


            document.getElementById(
                "usernameGroup"
            ).style.display =
                "block";


            document.getElementById(
                "passwordGroup"
            ).style.display =
                "none";


            document.getElementById(
                "password"
            ).required =
                false;


            document.getElementById(
                "fullName"
            ).value =
                data.fullName || "";


            document.getElementById(
                "email"
            ).value =
                data.email || "";


            document.getElementById(
                "phone"
            ).value =
                data.phone || "";


            document.getElementById(
                "address"
            ).value =
                data.address || "";


            document.getElementById(
                "role"
            ).value =
                data.role || "CUSTOMER";


            document.getElementById(
                "userModal"
            ).classList.add(
                "show"
            );


        } catch (error) {

            console.error(
                "Edit user error:",
                error
            );

            showMessage(
                error.message ||
                "Không thể tải thông tin user."
            );

        }

    }


    // =========================================================
    // SAVE USER
    // =========================================================

    document
        .getElementById("userForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                hideMessage();


                const token =
                    getToken();


                const editUserId =
                    document.getElementById(
                        "editUserId"
                    ).value;


                const isEdit =
                    !!editUserId;


                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const fullName =
                    document.getElementById(
                        "fullName"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const phone =
                    document.getElementById(
                        "phone"
                    ).value.trim();


                const address =
                    document.getElementById(
                        "address"
                    ).value.trim();


                const role =
                    document.getElementById(
                        "role"
                    ).value;


                if (!isEdit && !username) {

                    showMessage(
                        "Username không được để trống."
                    );

                    return;

                }


                if (!isEdit && !password) {

                    showMessage(
                        "Mật khẩu không được để trống."
                    );

                    return;

                }


                if (!fullName) {

                    showMessage(
                        "Họ tên không được để trống."
                    );

                    return;

                }


                const emailRegex =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (!emailRegex.test(email)) {

                    showMessage(
                        "Email không đúng định dạng."
                    );

                    return;

                }


                const phoneRegex =
                    /^0\d{9}$/;


                if (!phoneRegex.test(phone)) {

                    showMessage(
                        "Số điện thoại phải gồm 10 số và bắt đầu bằng 0."
                    );

                    return;

                }


                if (!address) {

                    showMessage(
                        "Địa chỉ không được để trống."
                    );

                    return;

                }


                const button =
                    document.getElementById(
                        "saveButton"
                    );


                button.disabled =
                    true;


                button.textContent =
                    "Đang lưu...";


                try {

                    let url;

                    let method;

                    let body;


                    if (isEdit) {

                        url =
                            `${API_BASE_URL}/users/${editUserId}`;

                        method =
                            "PUT";


                        body = {

                            fullName:
                                fullName,

                            email:
                                email,

                            phone:
                                phone,

                            address:
                                address,

                            role:
                                role

                        };

                    } else {

                        url =
                            `${API_BASE_URL}/users`;

                        method =
                            "POST";


                        body = {

                            username:
                                username,

                            password:
                                password,

                            fullName:
                                fullName,

                            email:
                                email,

                            phone:
                                phone,

                            address:
                                address,

                            role:
                                role

                        };

                    }


                    const response =
                        await fetch(
                            url,
                            {
                                method:
                                    method,

                                headers: {
                                    Authorization:
                                        `Bearer ${token}`,

                                    "Content-Type":
                                        "application/json",

                                    Accept:
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        body
                                    )
                            }
                        );


                    const data =
                        await readResponse(
                            response
                        );


                    if (!response.ok) {

                        throw new Error(
                            data?.message ||
                            data?.error ||
                            "Lưu người dùng thất bại."
                        );

                    }


                    closeModal();


                    showMessage(
                        isEdit
                            ? "Cập nhật người dùng thành công!"
                            : "Thêm người dùng thành công!",
                        "success"
                    );


                    await loadUsers();


                } catch (error) {

                    console.error(
                        "Save user error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Có lỗi khi lưu người dùng."
                    );


                } finally {

                    button.disabled =
                        false;

                    button.textContent =
                        "Lưu";

                }

            }
        );


    // =========================================================
    // CHANGE ROLE
    // =========================================================

    async function changeRole(
        id,
        currentRole
    ) {

        const newRole =
            currentRole === "ADMIN"
                ? "CUSTOMER"
                : "ADMIN";


        const confirmChange =
            confirm(
                `Bạn có chắc muốn đổi role từ ${currentRole} sang ${newRole}?`
            );


        if (!confirmChange) {
            return;
        }


        const token =
            getToken();


        try {

            // Lấy thông tin hiện tại
            const getResponse =
                await fetch(
                    `${API_BASE_URL}/users/${id}`,
                    {
                        method: "GET",

                        headers: {
                            Authorization:
                                `Bearer ${token}`,

                            Accept:
                                "application/json"
                        }
                    }
                );


            const user =
                await readResponse(
                    getResponse
                );


            if (!getResponse.ok) {

                throw new Error(
                    user?.message ||
                    "Không thể lấy thông tin user."
                );

            }


            const response =
                await fetch(
                    `${API_BASE_URL}/users/${id}`,
                    {
                        method: "PUT",

                        headers: {
                            Authorization:
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json",

                            Accept:
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                fullName:
                                    user.fullName,

                                email:
                                    user.email,

                                phone:
                                    user.phone,

                                address:
                                    user.address,

                                role:
                                    newRole

                            })
                    }
                );


            const data =
                await readResponse(
                    response
                );


            if (!response.ok) {

                throw new Error(
                    data?.message ||
                    data?.error ||
                    "Đổi role thất bại."
                );

            }


            showMessage(
                `Đã đổi role thành ${newRole}.`,
                "success"
            );


            await loadUsers();


        } catch (error) {

            console.error(
                "Change role error:",
                error
            );


            showMessage(
                error.message ||
                "Có lỗi khi đổi role."
            );

        }

    }


    // =========================================================
    // DELETE USER
    // =========================================================

    async function deleteUser(
        id,
        username
    ) {

        const confirmed =
            confirm(
                `Bạn có chắc muốn xóa tài khoản "${username}" không?\n\nHành động này không thể hoàn tác.`
            );


        if (!confirmed) {
            return;
        }


        const token =
            getToken();


        if (!token) {

            logout();

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/users/${id}`,
                    {
                        method: "DELETE",

                        headers: {
                            Authorization:
                                `Bearer ${token}`,

                            Accept:
                                "text/plain, application/json"
                        }
                    }
                );


            /*
             * QUAN TRỌNG:
             *
             * Backend UserController:
             *
             * return ResponseEntity.ok(
             *     "User deleted successfully with id: " + id
             * );
             *
             * Backend trả về TEXT,
             * không phải JSON.
             *
             * Vì vậy KHÔNG được:
             *
             * response.json()
             *
             * mà phải đọc:
             *
             * response.text()
             */

            const text =
                await response.text();


            console.log(
                "Delete user response:",
                text
            );


            if (!response.ok) {

                let errorMessage =
                    text ||
                    "Xóa user thất bại.";


                /*
                 * Nếu backend trả JSON
                 * trong trường hợp lỗi thì thử đọc JSON.
                 */

                try {

                    if (
                        text &&
                        (
                            text.startsWith("{") ||
                            text.startsWith("[")
                        )
                    ) {

                        const errorData =
                            JSON.parse(text);

                        errorMessage =
                            errorData.message ||
                            errorData.error ||
                            errorMessage;

                    }

                } catch (e) {

                    console.log(
                        "Response không phải JSON."
                    );

                }


                if (
                    response.status === 403
                ) {

                    errorMessage =
                        "Bạn không có quyền xóa người dùng.";

                }


                if (
                    response.status === 401
                ) {

                    logout();

                    return;

                }


                throw new Error(
                    errorMessage
                );

            }


            showMessage(
                text ||
                "Xóa người dùng thành công!",
                "success"
            );


            await loadUsers();


        } catch (error) {

            console.error(
                "Delete user error:",
                error
            );


            showMessage(
                error.message ||
                "Có lỗi khi xóa người dùng."
            );

        }

    }


    // =========================================================
    // BACK
    // =========================================================

    function goBack() {

        window.location.href =
            "dashboard.html";

    }


    // =========================================================
    // LOGOUT
    // =========================================================

    function logout() {

        localStorage.removeItem(
            "token"
        );

        localStorage.removeItem(
            "accessToken"
        );

        localStorage.removeItem(
            "userId"
        );

        localStorage.removeItem(
            "username"
        );

        localStorage.removeItem(
            "role"
        );


        window.location.href =
            "../login.html";

    }


    // =========================================================
    // CLOSE MODAL WHEN CLICK OUTSIDE
    // =========================================================

    document
        .getElementById("userModal")
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    this
                ) {

                    closeModal();

                }

            }
        );


    // =========================================================
    // START
    // =========================================================

    if (checkAdmin()) {

        loadUsers();

    }

</script>
