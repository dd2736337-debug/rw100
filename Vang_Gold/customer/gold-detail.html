<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Chi tiết Gold</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>

    <body>
        <div class="container mt-5">
            <div class="row">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-body">
                            <h2 id="name"></h2>

                            <hr />

                            <p>
                                <b>Loại:</b>
                                <span id="type"></span>
                            </p>

                            <p>
                                <b>Khối lượng:</b>
                                <span id="weight"></span>
                            </p>

                            <p>
                                <b>Giá:</b>
                                <span id="price"></span>
                            </p>

                            <p>
                                <b>Danh mục:</b>
                                <span id="category"></span>
                            </p>

                            <div class="mb-3">
                                <label>Số lượng</label>

                                <input
                                    type="number"
                                    id="quantity"
                                    value="1"
                                    min="1"
                                    class="form-control"
                                />
                            </div>

                            <button class="btn btn-success" onclick="buyNow()">
                                Mua ngay
                            </button>

                            <a href="home.html" class="btn btn-secondary">
                                Quay lại
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <script src="./js/gold-detail.js"></script>
    </body>
</html>
