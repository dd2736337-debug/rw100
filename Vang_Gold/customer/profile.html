        </div>

        <script>
            // =========================================================
            // CONFIG
            // =========================================================

            const API_BASE_URL = "http://localhost:8080/api";

            // =========================================================
            // DOM
            // =========================================================

            const loadingElement = document.getElementById("loading");

            const profileContent = document.getElementById("profileContent");

            const logoutArea = document.getElementById("logoutArea");

            const messageElement = document.getElementById("message");

            // =========================================================
            // TOKEN
            // =========================================================

            function getToken() {
                return (
                    localStorage.getItem("token") ||
                    localStorage.getItem("accessToken")
                );
            }

            // =========================================================
            // USER ID
            // =========================================================

            function getUserId() {
                const value = localStorage.getItem("userId");

                if (!value) {
                    return null;
                }

                const id = Number(value);

                if (Number.isNaN(id)) {
                    return null;
                }

                return id;
            }

            // =========================================================
            // MESSAGE
            // =========================================================

            function showMessage(message, type = "error") {
                messageElement.textContent = message || "Có lỗi xảy ra.";

                messageElement.className = "message " + type;

                window.scrollTo({
                    top: 0,
                    behavior: "smooth",
                });
            }

            function hideMessage() {
                messageElement.textContent = "";

                messageElement.className = "message";
            }

            // =========================================================
            // BACKEND RESPONSE
            // =========================================================

            async function readResponse(response) {
                const contentType = response.headers.get("content-type") || "";

                if (contentType.toLowerCase().includes("application/json")) {
                    try {
                        return await response.json();
                    } catch (error) {
                        return {};
                    }
                }

                const text = await response.text();

                return {
                    message: text,
                };
            }

            // =========================================================
            // ROLE
            // =========================================================

            function getRoleText(role) {
                if (role === "ADMIN") {
                    return "ADMIN";
                }

                if (role === "CUSTOMER") {
                    return "CUSTOMER";
                }

                return role || "---";
            }

            // =========================================================
            // LOAD PROFILE
            // =========================================================

            async function loadProfile() {
                hideMessage();

                const token = getToken();

                const userId = getUserId();

                if (!token || !userId) {
                    loadingElement.style.display = "none";

                    showMessage("Bạn chưa đăng nhập. Vui lòng đăng nhập lại.");

                    return;
                }

                try {
                    const response = await fetch(
                        `${API_BASE_URL}/users/${userId}`,
                        {
                            method: "GET",

                            headers: {
                                Authorization: `Bearer ${token}`,

                                Accept: "application/json",
                            },
                        },
                    );

                    const data = await readResponse(response);

                    console.log("Profile response:", data);

                    if (!response.ok) {
                        if (response.status === 401) {
                            throw new Error(
                                "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.",
                            );
                        }

                        if (response.status === 403) {
                            throw new Error(
                                "Bạn không có quyền xem thông tin tài khoản.",
                            );
                        }

                        throw new Error(
                            data?.message ||
                                data?.error ||
                                "Không thể tải thông tin tài khoản.",
                        );
                    }

                    // =====================================================
                    // DISPLAY
                    // =====================================================

                    document.getElementById("username").textContent =
                        data.username || "---";

                    document.getElementById("role").innerHTML = `
                <span class="role-badge">
                    ${getRoleText(data.role)}
                </span>
            `;

                    document.getElementById("userId").textContent =
                        data.id ?? data.userId ?? userId;

                    document.getElementById("fullName").value =
                        data.fullName || "";

                    document.getElementById("email").value = data.email || "";

                    document.getElementById("phone").value = data.phone || "";

                    document.getElementById("address").value =
                        data.address || "";

                    // Đồng bộ localStorage
                    if (data.username) {
                        localStorage.setItem("username", data.username);
                    }

                    if (data.role) {
                        localStorage.setItem("role", data.role);
                    }

                    if (data.id !== undefined && data.id !== null) {
                        localStorage.setItem("userId", String(data.id));
                    }

                    loadingElement.style.display = "none";

                    profileContent.style.display = "grid";

                    logoutArea.style.display = "block";
                } catch (error) {
                    console.error("Load profile error:", error);

                    loadingElement.style.display = "none";

                    showMessage(
                        error.message || "Có lỗi xảy ra khi tải thông tin.",
                    );
                }
            }

            // =========================================================
            // UPDATE PROFILE
            // =========================================================

            document
                .getElementById("profileForm")
                .addEventListener("submit", async function (event) {
                    event.preventDefault();

                    hideMessage();

                    const token = getToken();

                    const userId = getUserId();

                    if (!token || !userId) {
                        showMessage("Bạn chưa đăng nhập.");

                        return;
                    }

                    const fullName = document
                        .getElementById("fullName")
                        .value.trim();

                    const email = document.getElementById("email").value.trim();

                    const phone = document.getElementById("phone").value.trim();

                    const address = document
                        .getElementById("address")
                        .value.trim();

                    if (!fullName) {
                        showMessage("Họ tên không được để trống.");

                        return;
                    }

                    if (!email) {
                        showMessage("Email không được để trống.");

                        return;
                    }

                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                    if (!emailRegex.test(email)) {
                        showMessage("Email không đúng định dạng.");

                        return;
                    }

                    const phoneRegex = /^0\d{9}$/;

                    if (!phoneRegex.test(phone)) {
                        showMessage(
                            "Số điện thoại phải gồm 10 số và bắt đầu bằng 0.",
                        );

                        return;
                    }

                    if (!address) {
                        showMessage("Địa chỉ không được để trống.");

                        return;
                    }

                    const button = document.getElementById("updateButton");

                    button.disabled = true;

                    button.textContent = "Đang lưu...";

                    try {
                        const response = await fetch(
                            `${API_BASE_URL}/users/${userId}`,
                            {
                                method: "PUT",

                                headers: {
                                    Authorization: `Bearer ${token}`,

                                    "Content-Type": "application/json",

                                    Accept: "application/json",
                                },

                                body: JSON.stringify({
                                    fullName,
                                    email,
                                    phone,
                                    address,
                                }),
                            },
                        );

                        const data = await readResponse(response);

                        console.log("Update profile response:", data);

                        if (!response.ok) {
                            throw new Error(
                                data?.message ||
                                    data?.error ||
                                    "Cập nhật thông tin thất bại.",
                            );
                        }

                        if (data.username) {
                            localStorage.setItem("username", data.username);
                        }

                        showMessage(
                            "Cập nhật thông tin thành công!",
                            "success",
                        );

                        await loadProfile();
                    } catch (error) {
                        console.error("Update profile error:", error);

                        showMessage(
                            error.message ||
                                "Có lỗi xảy ra khi cập nhật thông tin.",
                        );
                    } finally {
                        button.disabled = false;

                        button.textContent = "Lưu thay đổi";
                    }
                });

            // =========================================================
            // CHANGE PASSWORD
            // =========================================================

            document
                .getElementById("passwordForm")
                .addEventListener("submit", async function (event) {
                    event.preventDefault();

                    hideMessage();

                    const token = getToken();

                    const userId = getUserId();

                    if (!token || !userId) {
                        showMessage("Bạn chưa đăng nhập.");

                        return;
                    }

                    const oldPassword =
                        document.getElementById("oldPassword").value;

                    const newPassword =
                        document.getElementById("newPassword").value;

                    if (!oldPassword.trim()) {
                        showMessage("Mật khẩu cũ không được để trống.");

                        return;
                    }

                    if (!newPassword.trim()) {
                        showMessage("Mật khẩu mới không được để trống.");

                        return;
                    }

                    if (newPassword.length < 6) {
                        showMessage("Mật khẩu mới tối thiểu 6 ký tự.");

                        return;
                    }

                    const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d).{6,}$/;

                    if (!passwordRegex.test(newPassword)) {
                        showMessage("Mật khẩu mới phải chứa cả chữ và số.");

                        return;
                    }

                    if (oldPassword === newPassword) {
                        showMessage("Mật khẩu mới phải khác mật khẩu cũ.");

                        return;
                    }

                    const button = document.getElementById("passwordButton");

                    button.disabled = true;

                    button.textContent = "Đang đổi mật khẩu...";

                    try {
                        const response = await fetch(
                            `${API_BASE_URL}/users/${userId}/change-password`,
                            {
                                method: "PUT",

                                headers: {
                                    Authorization: `Bearer ${token}`,

                                    "Content-Type": "application/json",

                                    Accept: "text/plain, application/json",
                                },

                                body: JSON.stringify({
                                    oldPassword,
                                    newPassword,
                                }),
                            },
                        );

                        /*
                         * Backend hiện tại:
                         *
                         * return ResponseEntity.ok(
                         *     "Đổi mật khẩu thành công"
                         * );
                         *
                         * Vì vậy response là TEXT.
                         *
                         * readResponse() đã xử lý được
                         * cả text và JSON.
                         */

                        const data = await readResponse(response);

                        console.log("Change password response:", data);

                        if (!response.ok) {
                            throw new Error(
                                data?.message ||
                                    data?.error ||
                                    "Đổi mật khẩu thất bại.",
                            );
                        }

                        // =================================================
                        // SUCCESS
                        // =================================================

                        document.getElementById("passwordForm").reset();

                        showMessage(
                            data?.message || "Đổi mật khẩu thành công!",
                            "success",
                        );
                    } catch (error) {
                        console.error("Change password error:", error);

                        showMessage(
                            error.message || "Có lỗi xảy ra khi đổi mật khẩu.",
                        );
                    } finally {
                        button.disabled = false;

                        button.textContent = "Đổi mật khẩu";
                    }
                });

            // =========================================================
            // SHOW / HIDE PASSWORD
            // =========================================================

            function togglePassword(inputId, button) {
                const input = document.getElementById(inputId);

                if (input.type === "password") {
                    input.type = "text";

                    button.textContent = "Ẩn";
                } else {
                    input.type = "password";

                    button.textContent = "Hiện";
                }
            }

            // =========================================================
            // LOGOUT
            // =========================================================

            function logout() {
                localStorage.removeItem("token");

                localStorage.removeItem("accessToken");

                localStorage.removeItem("userId");

                localStorage.removeItem("username");

                localStorage.removeItem("role");

                window.location.href = "../login.html";
            }

            // =========================================================
            // START
            // =========================================================

            loadProfile();
        </script>
