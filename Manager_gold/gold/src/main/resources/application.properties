spring.application.name=gold
#Cấu hình kết nối tới Database
spring.jpa.database=mysql
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gold?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
# Config tự động tạo bảng trong database(update, create, none)
spring.jpa.hibernate.ddl-auto=update
#format câu sql log
spring.jpa.properties.hibernate.format_sql=true
spring.main.allow-bean-definition-overriding=true
# Upload file
spring.servlet.multipart.enabled=true
# Giới hạn dung lượng ảnh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.jpa.show-sql=true
jwt.secret=goldSecretKey2026VeryLongSecretKey
jwt.expiration=86400000

